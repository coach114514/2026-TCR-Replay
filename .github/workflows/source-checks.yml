name: Source and synthetic demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s match_replay/tests -v
      - run: python -m compileall -q match_replay/tools
      - run: python tools/check_publication.py
      - run: python -m match_replay.tools.make_demo
      - run: python -m match_replay.tools.import_resources --source match_replay/unity/Assets/StreamingAssets/replay --dry-run
